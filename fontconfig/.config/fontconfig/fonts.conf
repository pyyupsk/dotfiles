<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>
 <!-- Thai fallback right after the Latin face, for apps that do not set lang -->
 <alias>
  <family>sans-serif</family>
  <prefer>
   <family>SF Pro Text</family>
   <family>Noto Sans</family>
   <family>Noto Sans Thai</family>
   <family>Noto Sans CJK JP</family>
  </prefer>
 </alias>
 <alias>
  <family>serif</family>
  <prefer>
   <family>Noto Serif</family>
   <family>Noto Serif Thai</family>
   <family>Noto Serif CJK JP</family>
  </prefer>
 </alias>
 <alias>
  <family>monospace</family>
  <prefer>
   <family>JetBrainsMono Nerd Font</family>
   <family>Noto Sans Thai</family>
   <family>Noto Sans Mono CJK JP</family>
  </prefer>
 </alias>
 <!-- loopless Thai face (like Leelawadee UI on Windows) for Thai text -->
 <match target="pattern">
  <test compare="contains" name="lang">
   <string>th</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>Noto Sans Thai</string>
  </edit>
 </match>
 <match target="pattern">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
</fontconfig>
