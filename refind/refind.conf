# rEFInd boot picker. install.sh (boot step) fills in @OPTIONS@ with the kernel command line.
timeout 5
resolution 1920 1080
use_graphics_for linux,windows
hideui hints,arrows,label,badges,editor,safemode,singleuser
banner themes/golden-gate/background.png
banner_scale fillscreen
big_icon_size 256
small_icon_size 48
selection_big themes/golden-gate/selection_big.png
selection_small themes/golden-gate/selection_small.png
icons_dir themes/golden-gate
scanfor manual
showtools firmware
default_selection "Arch Linux"

menuentry "Arch Linux" {
    icon   /EFI/refind/themes/golden-gate/os_arch.png
    loader /vmlinuz-linux
    initrd /initramfs-linux.img
    options "@OPTIONS@"
}

menuentry "Windows" {
    icon   /EFI/refind/themes/golden-gate/os_win.png
    loader /EFI/Microsoft/Boot/bootmgfw.efi
}
