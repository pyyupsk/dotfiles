format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"

[directory]
truncation_length = 3
style = "bold cyan"
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol $branch]($style) "

[git_status]
style = "bold red"
format = "[$all_status$ahead_behind]($style) "
modified = "!"
untracked = "?"
stashed = "≡"

[python]
symbol = " "
style = "bold yellow"
format = "via [$symbol ($version)]($style) "

[nodejs]
symbol = " "
style = "bold green"
format = "via [$symbol ($version)]($style) "

[rust]
symbol = "🦀"
style = "bold red"
format = "via [$symbol ($version)]($style) "

[cmd_duration]
min_time = 2_000
style = "yellow"
format = "[$duration]($style) "
