[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[window]
padding = { x = 12, y = 10 }
opacity = 0.96
blur = true
decorations = "Full"

[colors.primary]
background = "#1e1e1e"
foreground = "#f5f5f7"

[colors.cursor]
cursor = "#0a84ff"
text = "#ffffff"

[colors.selection]
background = "#3a3a3c"
text = "CellForeground"
